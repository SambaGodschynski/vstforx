<?xml version="1.0" standalone="no"?>
<!DOCTYPE svg PUBLIC "-//W3C//DTD SVG 1.1//EN" 
"http://www.w3.org/Graphics/SVG/1.1/DTD/svg11.dtd">
<svg width="740px" height="480px"
     xmlns="http://www.w3.org/2000/svg" version="1.1">
  <defs>
    <pattern id="bg" x="0" y="0" width="20" height="20" patternTransform="scale(0.3)" 
	     patternUnits="userSpaceOnUse">
      <rect x="0" y="0" width="20" height="20" fill="darkslategray"/>
      <rect x="0" y="0" width="10" height="10" fill="black" fill-opacity="0.3"/>
    </pattern>
  </defs>
  <!-- the following elements will not be drew on the view.
       the only purpose is to calculate a styling for 
       the related view objects.
       connecting
       selecting
       selected
       label
  --> 
  <g>
    <rect width="100%" height="100%" fill="url(#bg)"/>
    <g stroke="black">
      <!-- connections: 
           I/O = Input/Output
	   Pc = Processor (Plugin)
	   Pr = Parameter
	   Prop = Parameter operator connection
	   R = rollover
      --> 
      <line 
	  id="connecting" x1="225px" y1="300px" x2="275px" y2="100px"
	  style="stroke-width: 2; stroke: red;"
	  />
      
      <line 
	  id="I2O"   x1="35px" y1="300px" x2="85px" y2="100px"
	  style="stroke-width: 4; stroke: darkgrey; stroke-opacity:0.5;"
	    />
      <line 
	  id="I2O_R"   x1="55px" y1="300px" x2="105px" y2="100px"
	  style="stroke-width: 8; stroke: black; stroke-opacity:0.5;"
	  />

      <line 
	  id="Pc2I"  x1="135px" y1="300px" x2="185px" y2="100px"
	  style="stroke-width: 8; stroke: black; stroke-opacity:0.5;"
	  />
      <line 
	  id="Pc2O"  x1="155px" y1="300px" x2="205px" y2="100px"
	  style="stroke-width: 8; stroke: black; stroke-opacity:0.5;"
	    />
      <line 
	  id="Pc2Pr" x1="255px" y1="300px" x2="305px" y2="100px"
	  style="stroke-width: 2; stroke: red; purple;stroke-dasharray: 9, 5; stroke-opacity:0.5;"
	    />
      <line 
	  id="Pr2Pr" x1="305px" y1="300px" x2="355px" y2="100px"
	  style="stroke-width: 4; stroke: green;stroke-dasharray: 9, 5; stroke-opacity:0.5;"
	  />     
      <line 
	  id="Pr2Pr_R" x1="325px" y1="300px" x2="375px" y2="100px"
	  style="stroke-width: 8; stroke: green;stroke-dasharray: 9, 5; stroke-opacity:0.5;"
	  />
      <line 
	  id="Prop"  x1="375px" y1="300px" x2="425px" y2="100px"
	  style="stroke-width: 4; stroke: grey;stroke-dasharray: 9, 5; stroke-opacity:0.5;"
	  />
    </g>
    <g>
      <!-- selection -->
      <rect 
	  id="selecting" x="500px" y="100px" width="200" height="100"
	  style="stroke-width: 4; stroke: grey; fill: purple;stroke-dasharray: 9, 5; fill-opacity: 0.25"
	  />
      <rect 
	  id="selected" x="500px" y="210px" width="200" height="100"
	  style="stroke-width: 4; stroke: black; fill: purple; fill-opacity: 0.25"
	  />
    </g>
    <g transform="translate(30, 450)">
      <!-- flag -->
      <g id="flag"
	 style="stroke-width: 1; fill: none; stroke: darkgrey;font-size: 13; font-family: arial"
	 >
	<path 
	    d="M0,0 l50,-50 200,0" 
	      />
	<text x="60" y="-55">
	  youtu.be/v2xiSpKAHyA
	</text>
      </g>
    </g>
  </g>
</svg>

