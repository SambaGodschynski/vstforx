<?xml version="1.0" standalone="no"?>
<!DOCTYPE svg PUBLIC "-//W3C//DTD SVG 1.1//EN" 
"http://www.w3.org/Graphics/SVG/1.1/DTD/svg11.dtd">
<svg width="800" height="600" 
     xmlns="http://www.w3.org/2000/svg" 
     xmlns:xlink="http://www.w3.org/1999/xlink"
     version="1.1">
  <defs>
    <pattern id="bg" x="0" y="0" width="200" height="200"
	     patternUnits="userSpaceOnUse">
      <rect width="200" height="200" fill="#002050" 
	    stroke="white" 
	    stroke-opacity="0.5"
	    stroke-width="0.2"/>
    </pattern>
    <linearGradient id="shaderTB" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.6"/>
      <stop offset="4%" stop-color="#000000" stop-opacity="0.0"/>
      <stop offset="97%" stop-color="#000000" stop-opacity="0.0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.6"/>
    </linearGradient>
    <linearGradient id="shaderLR" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.6"/>
      <stop offset="2%" stop-color="#000000" stop-opacity="0.0"/>
      <stop offset="98%" stop-color="#000000" stop-opacity="0.0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.6"/>
    </linearGradient>
  </defs>
  <g>
    <rect x="0" y="0" width="100%" height="100%"
	  stroke-width="0" />
    <rect x="0" y="0" width="100%" height="100%"
	  fill="url(#bg)" stroke="black" id="background" class="disco"/>
    <rect x="0%" y="0%" width="100%" height="100%"
	  class="disco" id="main" fill="none"/>
    <rect x="0" y="0" width="100%" height="100%"
	  fill="url(#shaderTB)" stroke="black"/>
    <rect x="0" y="0" width="100%" height="100%"
	  fill="url(#shaderLR)" stroke="black"/>
  </g>  
</svg>
