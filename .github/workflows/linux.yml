name: Linux Build

on:
  push:
    branches: [ DISCO, main ]
  pull_request:
    branches: [ DISCO, main ]

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            cmake \
            pkg-config \
            libboost-filesystem-dev \
            libboost-system-dev \
            libboost-thread-dev \
            libboost-regex-dev \
            libboost-serialization-dev \
            libboost-date-time-dev \
            libboost-timer-dev \
            libboost-chrono-dev \
            libboost-program-options-dev \
            libcairo2-dev \
            liblua5.4-dev \
            libloki-dev \
            libx11-dev

      - name: Download sambag prebuilt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download prebuilt-latest \
            --repo SambaGodschynski/sambag \
            --pattern "sambag-linux-x64.tar.gz" \
            --output sambag-linux-x64.tar.gz
          mkdir -p sambag-dist
          tar xzf sambag-linux-x64.tar.gz -C sambag-dist
          echo "=== sambag-dist/lib ==="
          ls sambag-dist/lib/
          echo "=== sambag-dist/src ==="
          ls sambag-dist/src/sambag/dsp/ 2>/dev/null || echo "(no src/)"
          echo "=== ext/vstsdk2.4 ==="
          ls sambag-dist/ext/vstsdk2.4/pluginterfaces/vst2.x/ 2>/dev/null || echo "(no vstsdk)"

      - name: Configure
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DSAMBAG_DIST=${{ github.workspace }}/sambag-dist \
            2>&1 || (cat build/CMakeFiles/CMakeError.log 2>/dev/null; exit 1)

      - name: Build
        run: |
          set +e
          cmake --build build --target standalone --parallel $(nproc) 2>&1 | tee build.log
          rc=${PIPESTATUS[0]}
          if [ $rc -ne 0 ]; then
            echo "=== ERRORS ===" >&2
            grep -E "error:|undefined reference" build.log | head -50 >&2 || true
            exit $rc
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: vstforx-standalone-linux-x64
          path: |
            build/src/PluginApps/standalone
            build/src/PluginApps/images
            build/src/PluginApps/styles
            build/src/PluginApps/scripts
          retention-days: 14
