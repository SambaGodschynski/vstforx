name: Linux Build

on:
  push:
    branches: [ DISCO, main ]
  pull_request:
    branches: [ DISCO, main ]

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            cmake \
            pkg-config \
            libboost-filesystem-dev \
            libboost-system-dev \
            libboost-thread-dev \
            libboost-regex-dev \
            libboost-serialization-dev \
            libboost-date-time-dev \
            libboost-timer-dev \
            libboost-chrono-dev \
            libboost-program-options-dev \
            libcairo2-dev \
            liblua5.4-dev \
            libloki-dev \
            libx11-dev

      - name: Download sambag prebuilt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download prebuilt-latest \
            --repo SambaGodschynski/sambag \
            --pattern "sambag-linux-x64.tar.gz" \
            --output sambag-linux-x64.tar.gz
          mkdir -p sambag-dist
          tar xzf sambag-linux-x64.tar.gz -C sambag-dist

      - name: Configure
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH=${{ github.workspace }}/sambag-dist \
            -DFRX_VSTSDK2_DIR=${{ github.workspace }}/sambag-dist/ext/vstsdk2.4

      - name: Build
        run: cmake --build build --target standalone --parallel $(nproc)
